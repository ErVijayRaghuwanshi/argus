services:
  # ============================================================================
  # 1. Apache NiFi Edge Ingestion Gateway (Border Ingress & Normalization)
  # ============================================================================
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    ports:
      - "8443:8443" # Secure Admin HTTPS UI
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_ADMIN_USER}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_ADMIN_PASSWORD}"
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_SENSITIVE_PROPS_KEY: "${NIFI_SENSITIVE_PROPS_KEY}"
      NIFI_JVM_HEAP_INIT: "${NIFI_HEAP_INIT}"
      NIFI_JVM_HEAP_MAX: "${NIFI_HEAP_MAX}"
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_conf:/opt/nifi/nifi-current/conf
      - ./conf/nifi/flow.json.gz:/opt/nifi/nifi-current/conf/flow.json.gz
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 2. Apache Kafka Ingestion Buffer (KRaft Mode - Zookeeper-Free)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Node Roles & Identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      
      # Network Interfaces & Listeners Configuration
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      
      # Replication & Logging Tuning for Single-Broker Dev Sandbox
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS}"
      
      # Predefined 22-character Base64 UUID for local KRaft metadata initialization
      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 3. Kafka UI Dashboard (Web Visualizer)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kraft"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 3b. Kafka Declarative Topic Provisioner (Runs on startup and exits)
  # ============================================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      - kafka
    networks:
      - data-platform
    command: >
      sh -c "
      echo 'Waiting for Kafka broker...' &&
      cub kafka-ready -b kafka:29092 1 120 &&
      echo 'Creating telecom.cdr.raw...' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telecom.cdr.raw --partitions 3 --replication-factor 1 --config retention.ms=${KAFKA_TOPIC_RETENTION_MS} &&
      echo 'Creating isp.ipdr.raw...' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic isp.ipdr.raw --partitions 3 --replication-factor 1 --config retention.ms=${KAFKA_TOPIC_RETENTION_MS} &&
      echo 'All topics provisioned successfully!'
      "

  # ============================================================================
  # 4. Redis In-Memory Transactional Cache (Fast Session & Target Tracking)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - data-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # 5. Apache Solr (Multi-Column Ingest Header Search Index)
  # ============================================================================
  solr:
    image: solr:9
    container_name: solr
    ports:
      - "${SOLR_PORT}:8983"
    volumes:
      - solr_data:/var/solr
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 6. Neo4j Graph Database (Spatial-Temporal Entity Correlation)
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP Administration Panel
      - "7687:7687" # Bolt protocol connection port
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - data-platform
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

# ==============================================================================
# Network & Volume Bindings
# ==============================================================================
networks:
  data-platform:
    driver: bridge
    name: data-platform

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  solr_data:
  nifi_data:
  nifi_conf:
  redis_data:
