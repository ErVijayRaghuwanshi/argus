services:
  # ============================================================================
  # 1. Apache NiFi Edge Ingestion Gateway (Border Ingress & Normalization)
  # ============================================================================
  nifi:
    image: apache/nifi:2.9.0
    container_name: nifi
    user: "root"
    ports:
      - "${NIFI_PORT:-8443}:8443" # Secure Admin HTTPS UI
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_ADMIN_USER}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_ADMIN_PASSWORD}"
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_SENSITIVE_PROPS_KEY: "${NIFI_SENSITIVE_PROPS_KEY}"
      NIFI_JVM_HEAP_INIT: "${NIFI_HEAP_INIT}"
      NIFI_JVM_HEAP_MAX: "${NIFI_HEAP_MAX}"
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_conf:/opt/nifi/nifi-current/conf
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 1b. Apache NiFi Registry (GitOps Flow Version Control)
  # ============================================================================
  nifi-registry:
    image: apache/nifi-registry:2.9.0
    container_name: nifi-registry
    user: "root"
    ports:
      - "${NIFI_REGISTRY_PORT}:18080"
    environment:
      NIFI_REGISTRY_DB_DIR: "/opt/nifi-registry/nifi-registry-current/database"
      NIFI_REGISTRY_FLOW_STORAGE_DIR: "/opt/nifi-registry/nifi-registry-current/flow_storage"
    volumes:
      - registry_database:/opt/nifi-registry/nifi-registry-current/database
      - ./flow-storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      - registry_conf:/opt/nifi-registry/nifi-registry-current/conf
      - ./conf/nifi-registry/providers.xml:/opt/nifi-registry/nifi-registry-current/conf/providers.xml
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 2. Apache Kafka Ingestion Buffer (KRaft Mode - Zookeeper-Free)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:8.1.3
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # Node Roles & Identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      
      # Network Interfaces & Listeners Configuration
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      
      # Replication & Logging Tuning for Single-Broker Dev Sandbox
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      
      # Predefined 22-character Base64 UUID for local KRaft metadata initialization
      CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 2b. Kafka Schema Registry (Schema Source of Truth)
  # ============================================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.3
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 3. Kafka UI Dashboard (Web Visualizer)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kraft"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:${SCHEMA_REGISTRY_PORT:-8081}"
    networks:
      - data-platform
    restart: unless-stopped

  # ============================================================================
  # 4. Redis In-Memory Transactional Cache (Fast Session & Target Tracking)
  # ============================================================================
  redis:
    image: redis:7.4.9-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - data-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # 5. Apache Solr (Multi-Column Ingest Header Search Index)
  # ============================================================================
  solr:
    image: solr:9.10.1-slim
    container_name: solr
    ports:
      - "${SOLR_PORT}:8983"
    volumes:
      - solr_data:/var/solr
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 6. Neo4j Graph Database (Spatial-Temporal Entity Correlation)
  # ============================================================================
  neo4j:
    image: neo4j:5.26.26-community
    container_name: neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Administration Panel
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol connection port
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - data-platform
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ============================================================================
  # 7. SignalForge (Synthetic Telecom Logs Stream Generator)
  # ============================================================================
  signal-forge:
    build:
      context: "../signal-forge"
      dockerfile: Dockerfile
    container_name: signal-forge
    depends_on:
      - kafka
      - schema-registry 
    networks:
      - data-platform
    command: >
      --format kafka
      --stream
      --speed ${SIGNALFORGE_STREAM_SPEED}
      --users ${SIGNALFORGE_USERS_POOL}
      --towers ${SIGNALFORGE_TOWERS_POOL}
      --kafka-bootstrap kafka:29092
      --kafka-schema-registry http://schema-registry:${SCHEMA_REGISTRY_PORT:-8081}
      --kafka-cdr-topic ${KAFKA_CDR_TOPIC:-cdr-records}
      --kafka-ipdr-topic ${KAFKA_IPDR_TOPIC:-ipdr-records}
    restart: unless-stopped

  # ============================================================================
  # 8. Apache Spark Standalone Cluster (Master & Worker Core)
  # ============================================================================
  spark-master:
    build:
      context: .
      dockerfile: conf/spark.Dockerfile
    image: argus-spark-custom:4.1.2
    container_name: spark-master
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEBUI_PORT:-8085}:8080"
      - "${SPARK_HISTORY_WEBUI_PORT:-18088}:18080"
    command: >
      sh -c "
      mkdir -p /opt/spark/event_logs &&
      /opt/spark/bin/spark-class -Dspark.history.fs.logDirectory=file:/opt/spark/event_logs -Dspark.history.ui.port=18080 org.apache.spark.deploy.history.HistoryServer &
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
      "
    volumes:
      - spark_event_logs:/opt/spark/event_logs
      - spark_ivy_cache:/tmp/.ivy
      - ./example:/tmp/example
    networks:
      - data-platform
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: conf/spark.Dockerfile
    image: argus-spark-custom:4.1.2
    container_name: spark-worker
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8086}:8081"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
    volumes:
      - spark_event_logs:/opt/spark/event_logs
      - spark_ivy_cache:/tmp/.ivy
      - ./example:/tmp/example
    networks:
      - data-platform
    restart: unless-stopped

# ==============================================================================
# Network & Volume Bindings
# ==============================================================================
networks:
  data-platform:
    driver: bridge
    name: data-platform

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  solr_data:
  nifi_data:
  nifi_conf:
  redis_data:
  registry_database:
  registry_flow_storage:
  registry_conf:
  spark_event_logs:
  spark_ivy_cache:
